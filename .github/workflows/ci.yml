name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftFormat lint (advisory)
    runs-on: macos-latest
    # Upstream code has thousands of pre-existing violations; a one-time
    # `swiftformat .` pass is planned in the Quality Gate phase. Until then
    # lint reports but does not block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Lint
        run: swiftformat --lint .

  test:
    name: Unit tests (${{ matrix.scheme }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: Packages/Models, scheme: ModelsTests }
          - { package: Packages/NetworkClient, scheme: NetworkClientTests }
          - { package: Packages/Timeline, scheme: TimelineTests }
          - { package: Packages/Account, scheme: AccountTests }
          - { package: Packages/StatusKit, scheme: StatusKitTests }
          - { package: Packages/Env, scheme: EnvTests }
    steps:
      - uses: actions/checkout@v4
      - name: Pick simulator
        id: sim
        run: |
          SIM="$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^ +([^(]+) \(.*/\1/' | xargs)"
          echo "Using simulator: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"
      - name: Run package tests
        run: |
          xcodebuild test \
            -scheme ${{ matrix.scheme }} \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            CODE_SIGNING_ALLOWED=NO
        working-directory: ${{ matrix.package }}

  build:
    name: Build app (unsigned)
    runs-on: macos-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Pick simulator
        id: sim
        run: |
          SIM="$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^ +([^(]+) \(.*/\1/' | xargs)"
          echo "Using simulator: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"
      - name: Generate xcconfig
        run: |
          sed -e 's/YOUR_TEAM_ID/0000000000/' -e 's/com.example/com.alzimerahmed/' \
            FrostGram.xcconfig.template > FrostGram.xcconfig
      - name: Build
        run: |
          xcodebuild build \
            -project FrostGram.xcodeproj \
            -scheme FrostGram \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            CODE_SIGNING_ALLOWED=NO
