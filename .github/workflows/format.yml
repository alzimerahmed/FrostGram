name: One-time SwiftFormat pass
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    name: swiftformat .
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install SwiftFormat
        run: brew install swiftformat
      - name: Format
        run: swiftformat . --indent 2
      - name: Commit formatting pass
        run: |
          git config user.name "FrostGram CI"
          git config user.email "ci@frostgram.local"
          git add -A
          git diff --cached --quiet && echo "No formatting changes" && exit 0
          git commit -m "style: one-time swiftformat pass (Phase 9 quality gate)"
          git push origin main
